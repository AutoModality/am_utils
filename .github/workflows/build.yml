name: C/C++ CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-16.04
    name: Full Build
    steps:
    - name: builddir
      run: mkdir -p catkin_ws/src
    - uses: actions/checkout@v1
      with:
        path: catkin_ws/src
    - name: configure
      run: echo "Hello CI build world!"
    - name: Init
      run: cd catkin_ws && catkin init --reset
    - name: Build
      run: cd catkin_ws && catkin build
