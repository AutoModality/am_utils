name: Story Development

on:
  push:
    branches:    
    - '[A-Z]+-[0-9]+'
    - '[A-Z]+-[0-9]+/*'
    - 'feature/*'
jobs:
  build:
    runs-on: ubuntu-16.04
    steps:
      - uses: docker.cloudsmith.io/automodality/trial/amros-base:latest
      - uses: actions/checkout@v1
      - name: make
        run: debian/rules build
