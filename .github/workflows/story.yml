name: Story Development

on:
  push:
    branches-ignore:
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-18.04]
      fail-fast: true
    steps:
      - uses: actions/checkout@v2
      - name: Cache
        id: cache
        uses: actions/cache@v1
        with:
          path: catkin_ws
          key: ${{ hashFiles('CMakeLists.txt') }}
      - name: Cache Found
        if: steps.cache.outputs.cache-hit == 'true'
        run: du -sh catkin_ws/
      - name: Package
        uses: AutoModality/action-package-debian-ros@v1
        with:
          dev-repo-entitlement: ${{ secrets.CLOUDSMITH_READ_DEV_ENTITLEMENT }}
          release-repo-entitlement: ${{ secrets.CLOUDSMITH_READ_RELEASE_ENTITLEMENT }}
        


