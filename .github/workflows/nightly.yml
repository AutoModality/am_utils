name: Nightly
on: 
  schedule:
    - cron: '05 05 * * *'
  push:
    branches-ignore:
      - master
jobs:
  build:
    runs-on: [x64, self-hosted,linux,build]
    steps:
      - uses: AutoModality/action-clean@v1.1.0
      - uses: actions/checkout@v2
      - name: Deploy
        run: amros dev docker run -dm --command="amros dev build deb"

